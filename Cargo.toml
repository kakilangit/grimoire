[workspace]
resolver = "2"
members = [
    "sdk",
    "plugins/*",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
serde = "1"
serde_json = "1"
tokio = "1"
tokio-stream = "0.1"
axum = "0.8"
reqwest = "0.13"
tracing = "0.1"
tracing-subscriber = "0.3"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
base64 = "0.22"
futures-util = "0.3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "deny"
expect_used = "deny"
