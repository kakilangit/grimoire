name: Publish SDK
on:
  push:
    tags:
      - 'sdk-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo.toml version matches tag
        run: |
          cargo_version=$(grep '^version' sdk/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$cargo_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag version (${{ steps.version.outputs.version }}) does not match Cargo.toml version ($cargo_version)"
            exit 1
          fi

      - name: Check if already published on crates.io
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STATUS=$(curl -sL -o /dev/null -w '%{http_code}' "https://crates.io/api/v1/crates/grimoire-sdk/$VERSION")
          echo "crates.io status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "grimoire-sdk $VERSION already on crates.io — skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "grimoire-sdk $VERSION not found on crates.io (status $STATUS) — will publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.check.outputs.published == 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        if: steps.check.outputs.published == 'false'
        run: cargo publish -p grimoire-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Check if GitHub Release exists
        id: gh_release
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.gh_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          name: "grimoire-sdk v${{ steps.version.outputs.version }}"
          body: "SDK crate `grimoire-sdk` version ${{ steps.version.outputs.version }}"
          generate_release_notes: true
