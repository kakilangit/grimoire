name: Release Plugin
on:
  push:
    branches: [main]
    paths:
      - 'plugins/*/VERSION'

env:
  REGISTRY: ghcr.io

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.changed.outputs.plugins }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: changed
        run: |
          plugins=$(git diff --name-only HEAD~1 HEAD | \
            grep '^plugins/.*/VERSION$' | \
            sed 's|plugins/\(.*\)/VERSION|\1|' | \
            jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  check:
    needs: detect
    if: needs.detect.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: ${{ fromJson(needs.detect.outputs.plugins) }}
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Read VERSION file
        id: version
        run: echo "version=$(cat plugins/${{ matrix.plugin }}/VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Check if version is newer than released
        id: check
        run: |
          FILE_VERSION="${{ steps.version.outputs.version }}"

          RELEASED=$(gh release list --repo "${{ github.repository }}" \
            --json tagName --jq '[.[] | select(.tagName | startswith("${{ matrix.plugin }}-v")) | .tagName | ltrimstr("${{ matrix.plugin }}-v")] | sort | reverse | .[0] // ""' 2>/dev/null || echo "")

          if [ -z "$RELEASED" ]; then
            echo "No existing release found — first release"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Released: $RELEASED, VERSION file: $FILE_VERSION"
            IFS='.' read -r r_major r_minor r_patch <<< "$RELEASED"
            IFS='.' read -r f_major f_minor f_patch <<< "$FILE_VERSION"
            r_major=${r_major:-0}; r_minor=${r_minor:-0}; r_patch=${r_patch:-0}
            f_major=${f_major:-0}; f_minor=${f_minor:-0}; f_patch=${f_patch:-0}

            if [ "$f_major" -gt "$r_major" ] || \
               { [ "$f_major" -eq "$r_major" ] && [ "$f_minor" -gt "$r_minor" ]; } || \
               { [ "$f_major" -eq "$r_major" ] && [ "$f_minor" -eq "$r_minor" ] && [ "$f_patch" -gt "$r_patch" ]; }; then
              echo "VERSION $FILE_VERSION is newer than released $RELEASED"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "VERSION $FILE_VERSION is not newer than released $RELEASED — skipping"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        plugin: ${{ fromJson(needs.detect.outputs.plugins) }}
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: plugins/${{ matrix.plugin }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/grimoire-${{ matrix.plugin }}:${{ needs.check.outputs.version }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Grimoire plugin: ${{ matrix.plugin }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/grimoire-${{ matrix.plugin }}:${{ needs.check.outputs.version }}-${{ matrix.suffix }}
          cache-to: type=inline

  manifest:
    name: Manifest & Release
    needs: [check, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: ${{ fromJson(needs.detect.outputs.plugins) }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/grimoire-${{ matrix.plugin }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t $IMAGE:$VERSION \
            -t $IMAGE:latest \
            $IMAGE:$VERSION-amd64 \
            $IMAGE:$VERSION-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.plugin }}-v${{ needs.check.outputs.version }}
          name: "grimoire-${{ matrix.plugin }} v${{ needs.check.outputs.version }}"
          body: "Plugin `grimoire-${{ matrix.plugin }}` version ${{ needs.check.outputs.version }}"
          generate_release_notes: true
