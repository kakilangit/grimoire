name: Release Plugin
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Scan plugins for unreleased versions
        id: scan
        run: |
          results='[]'
          for version_file in plugins/*/VERSION; do
            plugin=$(echo "$version_file" | sed 's|plugins/\(.*\)/VERSION|\1|')
            version=$(cat "$version_file" | tr -d '[:space:]')
            tag="${plugin}-v${version}"

            if gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
              echo "Release $tag already exists — skipping $plugin"
            else
              echo "No release $tag — will build $plugin $version"
              results=$(echo "$results" | jq -c --arg p "$plugin" --arg v "$version" '. + [{"plugin": $p, "version": $v}]')
            fi
          done

          if [ "$results" = "[]" ]; then
            echo "matrix=" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(echo "$results" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: detect
    if: needs.detect.outputs.matrix != ''
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
      fail-fast: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Resolve plugins to build
        id: plugins
        run: echo "plugins=$(echo '${{ needs.detect.outputs.matrix }}' | jq -c '.include')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push each plugin
        run: |
          echo '${{ steps.plugins.outputs.plugins }}' | jq -c '.[]' | while read -r entry; do
            plugin=$(echo "$entry" | jq -r '.plugin')
            version=$(echo "$entry" | jq -r '.version')
            image="${{ env.REGISTRY }}/${{ github.repository_owner }}/grimoire-${plugin}"

            echo "Building $plugin $version for ${{ matrix.platform }}"
            docker buildx build \
              --platform ${{ matrix.platform }} \
              --file "plugins/${plugin}/Dockerfile" \
              --tag "${image}:${version}-${{ matrix.suffix }}" \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --label "org.opencontainers.image.description=Grimoire plugin: ${plugin}" \
              --label "org.opencontainers.image.licenses=MIT" \
              --cache-from "type=registry,ref=${image}:${version}-${{ matrix.suffix }}" \
              --push \
              .
          done

  manifest:
    name: Manifest & Release
    needs: [detect, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifests and releases
        run: |
          echo '${{ needs.detect.outputs.matrix }}' | jq -c '.include[]' | while read -r entry; do
            plugin=$(echo "$entry" | jq -r '.plugin')
            version=$(echo "$entry" | jq -r '.version')
            image="${{ env.REGISTRY }}/${{ github.repository_owner }}/grimoire-${plugin}"
            tag="${plugin}-v${version}"

            echo "Creating manifest for $plugin $version"
            docker buildx imagetools create \
              -t "${image}:${version}" \
              -t "${image}:latest" \
              "${image}:${version}-amd64" \
              "${image}:${version}-arm64"

            echo "Creating GitHub release $tag"
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --title "grimoire-${plugin} v${version}" \
              --notes "Plugin \`grimoire-${plugin}\` version ${version}" \
              --generate-notes
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
