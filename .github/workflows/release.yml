name: Release Plugin
on:
  push:
    branches: [main]
    paths:
      - 'plugins/*/VERSION'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.changed.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: changed
        run: |
          plugins=$(git diff --name-only HEAD~1 HEAD | \
            grep '^plugins/.*/VERSION$' | \
            sed 's|plugins/\(.*\)/VERSION|\1|' | \
            jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: ${{ fromJson(needs.detect.outputs.plugins) }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION file
        id: version
        run: echo "version=$(cat plugins/${{ matrix.plugin }}/VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Check if version is newer than released
        id: check
        run: |
          FILE_VERSION="${{ steps.version.outputs.version }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/grimoire-${{ matrix.plugin }}"

          # Try to get the latest released tag from GitHub releases
          RELEASED=$(gh release list --repo "${{ github.repository }}" \
            --json tagName --jq '[.[] | select(.tagName | startswith("${{ matrix.plugin }}-v")) | .tagName | ltrimstr("${{ matrix.plugin }}-v")] | sort | reverse | .[0] // ""' 2>/dev/null || echo "")

          if [ -z "$RELEASED" ]; then
            echo "No existing release found — first release"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Released: $RELEASED, VERSION file: $FILE_VERSION"
            # Compare semver: split on dots, compare numerically
            IFS='.' read -r r_major r_minor r_patch <<< "$RELEASED"
            IFS='.' read -r f_major f_minor f_patch <<< "$FILE_VERSION"
            r_major=${r_major:-0}; r_minor=${r_minor:-0}; r_patch=${r_patch:-0}
            f_major=${f_major:-0}; f_minor=${f_minor:-0}; f_patch=${f_patch:-0}

            if [ "$f_major" -gt "$r_major" ] || \
               { [ "$f_major" -eq "$r_major" ] && [ "$f_minor" -gt "$r_minor" ]; } || \
               { [ "$f_major" -eq "$r_major" ] && [ "$f_minor" -eq "$r_minor" ] && [ "$f_patch" -gt "$r_patch" ]; }; then
              echo "VERSION $FILE_VERSION is newer than released $RELEASED"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "VERSION $FILE_VERSION is not newer than released $RELEASED — skipping"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.should_release == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.check.outputs.should_release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.should_release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: plugins/${{ matrix.plugin }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/grimoire-${{ matrix.plugin }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/grimoire-${{ matrix.plugin }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: steps.check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.plugin }}-v${{ steps.version.outputs.version }}
          name: "grimoire-${{ matrix.plugin }} v${{ steps.version.outputs.version }}"
          body: "Plugin `grimoire-${{ matrix.plugin }}` version ${{ steps.version.outputs.version }}"
          generate_release_notes: true
